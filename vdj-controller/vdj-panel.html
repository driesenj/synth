ght="normal" fill="#222">290.0</text><text x="285" y="113" font-size="2.4" text-anchor="end" font-weight="normal" fill="#222">203.0</text><text x="12" y="127.6" font-size="3" text-anchor="start" font-weight="bold" fill="#222">PARTS</text><text x="12" y="132.2" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">12 × rotary pot, cheap 16 mm (WH148 type), 10 k lin, M7 bushing:</text><text x="12" y="135.5" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">Ø7. Twist off the anti-rotation tab, or drill a Ø3 for it using</text><text x="12" y="138.8" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">the pot as a jig. Knobs up to Ø20.</text><text x="12" y="143.5" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">3 × Bourns PTA4543-2015DPB103 (45 mm travel, 15 mm metal lever,</text><text x="12" y="146.8" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">10 k lin). Hangs under the panel on 2 × M2 countersunk screws,</text><text x="12" y="150.1" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">56 mm apart on the slot axis; screw length = panel + 2 mm at</text><text x="12" y="153.4" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">most, the tapped holes are shallow.</text><text x="12" y="158.1" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">16 × TinyTronics AB6Y-M-BLACK, 16 mm momentary (not AB6Y-A: that</text><text x="12" y="161.4" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">one latches). Ø16, M16×1 nut, panel up to 7 mm, 2.8 mm spade</text><text x="12" y="164.7" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">terminals, 32 mm deep.</text><text x="12" y="169.4" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">6 × M3 panel fixing — optional, move them to suit the enclosure.</text><text x="106" y="127.6" font-size="3" text-anchor="start" font-weight="bold" fill="#222">PANEL</text><text x="106" y="132.2" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">297 × 210 mm (A4), 2–4 mm aluminium or acrylic. The pots&#x27; M7</text><text x="106" y="135.5" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">thread is the thickness limit; on 3 mm the fader levers stand 12</text><text x="106" y="138.8" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">mm proud for the caps.</text><text x="106" y="143.5" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">Leave ≥ 35 mm inside the enclosure (buttons are 32 mm deep).</text><text x="106" y="146.8" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">Behind the panel nothing comes within 12 mm of the edge, so</text><text x="106" y="150.1" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">walls up to ~11 mm thick clear everything.</text><text x="106" y="154.8" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">Spacing: deck columns 32 mm, mixer columns 38 mm, EQ rows 28 mm,</text><text x="106" y="158.1" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">deck rows ~50 mm. Every row lines up across the whole panel.</text><text x="200" y="127.6" font-size="3" text-anchor="start" font-weight="bold" fill="#222">DRILLING</text><text x="200" y="132.2" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">Print page 2 at 100 % (&quot;actual size&quot;, no fit-to-page). Check the</text><text x="200" y="135.5" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">100 mm and 50 mm bars with a ruler — printers can scale x and y</text><text x="200" y="138.8" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">differently. The M3 marks are 7 mm from both edges: align the</text><text x="200" y="142.1" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">sheet by those if the printer shifted the image.</text><text x="200" y="146.8" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">Tape it to the FRONT face. Centre-punch every dot (slot ends</text><text x="200" y="150.1" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">included), pilot Ø3 everywhere.</text><text x="200" y="154.8" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">Ø16 and Ø7: step drill. Slots: Ø3 at both end marks, cut between</text><text x="200" y="158.1" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">with a fret/coping saw, file to the lines; that gives the lever</text><text x="200" y="161.4" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">1 mm spare at each end of travel.</text><text x="200" y="166.1" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">Drill the M2 holes before the slots: there is only 1.8 mm of web</text><text x="200" y="169.4" font-size="2.35" text-anchor="start" font-weight="normal" fill="#222">between them.</text></svg></div></body></html>
