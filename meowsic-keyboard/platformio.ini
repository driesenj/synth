; Meowsic MIDI - firmware (docs/firmware.md), plus its bring-up and test tools
;
; Arduino IDE alternative: copy src/*.cpp and src/*.h into a sketch folder,
; rename main.cpp to <foldername>.ino, board = "ESP32 Dev Module".

[env]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=0        ; keep UART0 clean - it is a MIDI port
    -Wall

; WiFi and BT are never initialised, so both radios stay powered down.
; Nothing further is needed to keep them off.

; ---- the real firmware ------------------------------------------------------
[env:esp32dev]
build_src_filter = +<*> -<selftest.cpp> -<systest.cpp> -<muxtest.cpp> -<demo.cpp>

; ---- the same firmware, text log on UART0 -----------------------------------
; USB_MIDI 0: UART0 carries a human-readable log of every key, command and
; state change instead of MIDI, and 's' on the monitor dumps the state. DIN
; MIDI works as usual. This is what the acceptance runs in docs/tests.md read.
;
;   pio run -e text -t upload && pio device monitor -b 115200
[env:text]
build_src_filter = ${env:esp32dev.build_src_filter}
build_flags      = ${env.build_flags} -DUSB_MIDI=0
monitor_echo     = yes

; ---- I2C board bring-up self test -------------------------------------------
; Hardware diagnostic for the I2C board: the MCP23017 and both MCP4725s, on
; USB alone - no blob, no 12 V. Shares mcp23017.cpp and mcp4725.cpp with the
; firmware above so a pass here exercises the production drivers, not
; throwaways. position_map.cpp is in so the matrix monitor can name what it
; sees. See README, "Bring-up".
;
;   pio run -e selftest -t upload && pio device monitor -b 115200
;
; monitor_echo makes the single-letter commands visible as you type them.
[env:selftest]
build_src_filter = +<selftest.cpp> +<mcp23017.cpp> +<mcp4725.cpp> +<keybed.cpp> +<inject.cpp> +<position_map.cpp>
build_flags      = -Wall -DCORE_DEBUG_LEVEL=1   ; UART0 is not MIDI here: let Wire print its error code when a transaction fails
monitor_echo     = yes

; ---- panel test -------------------------------------------------------------
; The finished instrument, every function from the outside: CV / gate / AUX at
; the jacks for a meter or a VCO, the pots, the CV select switch, the clock
; jack (loopback from gate 1, or an external clock counted), both DIN sockets
; (loopback, a beacon out, a decoded monitor in), the LED, the keybed, and the
; toy through the injector into the audio jack. See README, "Bring-up".
;
;   pio run -e systest -t upload && pio device monitor -b 115200
[env:systest]
build_src_filter = +<systest.cpp> +<mcp23017.cpp> +<mcp4725.cpp> +<keybed.cpp> +<inject.cpp> +<position_map.cpp>
monitor_echo     = yes

; ---- 74HCT4051 injection bring-up self test --------------------------------
; Needs only the ESP32 and the two muxes on 5 V. No I2C, so the MCP23017 and
; the DAC can stay unplugged. Drives the selects and INH from the serial
; monitor; results are read with a multimeter on the blob-side pads, or heard
; from the blob if it is powered. See README, "Bring-up".
;
;   pio run -e muxtest -t upload && pio device monitor -b 115200
[env:muxtest]
build_src_filter = +<muxtest.cpp> +<position_map.cpp> +<inject.cpp>
monitor_echo     = yes

; ---- injection demo ---------------------------------------------------------
; Loops a tune through the toy's voices on the production injector. Needs the
; muxes and the blob powered; no I2C. Starts by itself. See README, "Demo".
;
;   pio run -e demo -t upload && pio device monitor -b 115200
[env:demo]
build_src_filter = +<demo.cpp> +<position_map.cpp> +<inject.cpp>
monitor_echo     = yes
